name: gitleaks

# Secret scanning. GitHub's native secret scanning + push protection are ON for
# the public repos, but they require GitHub Advanced Security on private ones
# (GitHub Pro does not include it), so this workflow is the only secret gate
# that works uniformly across all of them.
#
# Scans FULL history, not just the diff: a secret introduced in an earlier
# commit on the branch is still a secret once merged. Known fixtures are
# allowlisted in .gitleaks.toml rather than by weakening the scan.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this gate never writes back.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because `gitleaks detect` walks history; the default
      # shallow clone would silently scan only the tip commit.
      # persist-credentials: false so no usable git token is left on disk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pinned binary rather than gitleaks-action: no marketplace action to
      # trust, no licence key (the action requires one for organisations), and
      # the version is explicit rather than floating on a tag.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version

      # --redact so a real finding never echoes the secret into public CI logs.
      - name: Scan for secrets
        run: ./gitleaks detect --no-banner --redact --exit-code 1
